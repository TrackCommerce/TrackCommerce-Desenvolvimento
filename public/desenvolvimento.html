<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Em desenvolvimento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="linha"></div>

            <h1>Em desenvolvimento</h1>

            <p>
                Estamos trabalhando nesta página.
                Em breve ela estará disponível.
            </p>

            <button onclick="history.back()">
                Voltar
            </button>

        </div>

    </div>

</body>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #203566;
}

.container {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 450px;

    background-color: white;

    padding: 40px;

    text-align: center;

    border-radius: 10px;
}

.linha {
    width: 60px;
    height: 5px;

    background-color: #ff4500;

    margin: 0 auto 25px;
}

h1 {
    color: #203566;

    font-size: 30px;

    margin-bottom: 15px;
}

p {
    color: #555;

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 25px;
}

button {
    background-color: #ff4500;

    color: white;

    border: none;

    padding: 10px 25px;

    border-radius: 5px;

    font-size: 15px;

    cursor: pointer;
}

button:hover {
    background-color: #d93b00;
}
</style>
</html>
