<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackCommerce | Tela de Funcionários</title>

    <link rel="stylesheet" href="css/registroFunc.css">
    <link rel="icon" href="assets/icon/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

   <aside class="sidebar">

    <div class="logo">
        <div class="logo-img">
            <img src="./assets/icon/logo.png" alt="Logo"> 
        </div>

        <h2>TrackCommerce</h2>
    </div>

    <nav class="menu">

        <a href="#" class="item">
            <div class="icone">
                <img src="./assets/imgs/home.png" alt="">
            </div>
            <span>Painel</span>
        </a>

        <a href="lista-instancia.html" class="item">
            <div class="icone">
                <img src="./assets/imgs/server.png" alt="">
            </div>
            <span>Servidores Ativos</span>
        </a>

        <a href="#" class="item">
            <div class="icone">
                <img src="./assets/imgs/bell.png" alt="">
            </div>
            <span>Alertas</span>
        </a>

        <a href="#" class="item">
            <div class="icone">
                <img src="./assets/imgs/settings.png" alt="">
            </div>
            <span>Configurações</span>
        </a>

        <a href="permissoes.html" class="item">
            <div class="icone">
                <img src="./assets/imgs/chave-permissao.png" alt="">
            </div>
            <span>Permissões de Grupos</span>
        </a>

        <a href="cadastro-instancia.html" class="item">
            <div class="icone">
                <img src="./assets/imgs/server.png" alt="">
            </div>
            <span>Cadastro de Servidores</span>
        </a>

        <a href="registroFunc.html" class="item ativo">
            <div class="icone">
                <img src="./assets/imgs/cadastro.png" alt="">
            </div>
            <span>Cadastro de Funcionários</span>
        </a>

    </nav>

    <div class="usuario">

        <div class="foto">
            <img src="./assets/imgs/usuario-icone.webp" alt="Usuário">
        </div>

        <div class="info">
            <h3>Usuário</h3>
            <p>Cargo</p>
        </div>

    </div>

</aside>

    <div class="conteiner">
        <h1 class="titulo-pagina">Funcionarios</h1>

        <div class="conteudo-principal">
            <div class="painel-esquerdo">
                <div class="caixa-pesquisa">
                    <input type="text" id="campo-pesquisa" class="campo-pesquisa" placeholder="Pesquisar Funcionario">
                    
                    <select id="seletor-filtro" class="seletor-filtro">
                        <option value="nome">Nome</option>
                        <option value="cargo">Cargo</option>
                        <option value="email">Email</option>
                    </select>
                </div>

                <div id="lista-funcionarios" class="lista-funcionarios"></div>
            </div>

            <div class="painel-direito">
                <div class="caixa-formulario">
                    <div class="conteudo-formulario">
                        <h2>Cadastrar funcionário</h2>
                        <div class="grupo-campos">
                            <input type="text" placeholder="Nome: " id="registro-nome">
                            <input type="text" placeholder="Cargo: (Ex. Analista)" id="registro-cargo">
                            <input type="text" placeholder="Contato (Ex. (11)95678-9898)" id="registro-ctt" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000">
                            <input type="text" placeholder="Email (Ex. nome@email.com)" id="registro-email">
                            <select>
                                <option>Permissões</option>
                            </select>
                        </div>
                        <div id="aviso" class="caixa-formulario"></div>
                    </div>
                </div>
                <div class="grupo-botoes-acao" style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="btn-salvar" class="botao-salvar" style="width: 65%;" onclick="registrarFunc()">Salvar usuário</button>
                    <button id="btn-atualizar" class="botao-salvar" style="width: 65%;" onclick="atualizarFunc()">Atualizar funcionário</button>
                    <button id="btn-deletar" class="botao-salvar" style=" width: 35%; background-color: #dc3545;" onclick="deletarFunc()">Deletar</button>
                </div>

                <button id="btn-cancelar" class="botao-salvar" style="display: none; background-color: #6c757d; margin-top: 10px; width: 100%;" onclick="cancelarEdicao()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/registroFunc.js">
    </script>
</body>
</html>
