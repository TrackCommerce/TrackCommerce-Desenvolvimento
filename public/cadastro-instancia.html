<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/cadastro-instancia.css">
    <link rel="stylesheet" href="./css/sidebar.css">

    <link rel="icon" href="assets/icon/logo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <title>TrackCommerce | Cadastro de novo servidor</title>
</head>

<body>

    <div class="container-main cadastro-instancia-layout">

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-img">
                    <img src="./assets/icon/logo.png" alt="Logo">
                </div>

                <h2>TrackCommerce</h2>
            </div>

            <nav class="menu">

                <a href="desenvolvimento.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/home.png" alt="">
                    </div>
                    <span>Painel</span>
                </a>

                <a href="selecionar-servidor.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/server.png" alt="">
                    </div>
                    <span>Servidores Ativos</span>
                </a>

                <a href="desenvolvimento.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/bell.png" alt="">
                    </div>
                    <span>Alertas</span>
                </a>

                <a href="lista-instancia.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/server.png" alt="">
                    </div>
                    <span>Listagem de Servidores</span>
                </a>

                <a href="permissoes.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/chave-permissao.png" alt="">
                    </div>
                    <span>Permissões de Grupos</span>
                </a>

                <a href="cadastro-instancia.html" class="item ativo">
                    <div class="icone">
                        <img src="./assets/imgs/server.png" alt="">
                    </div>
                    <span>Cadastro de Servidores</span>
                </a>

                <a href="registroFunc.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/cadastro.png" alt="">
                    </div>
                    <span>Cadastro de Funcionários</span>
                </a>

            </nav>

            <div class="usuario">

                <div class="foto">
                    <img src="./assets/imgs/usuario-icone.webp" alt="Usuário">
                </div>

                <div class="info">
                    <h3>Usuário</h3>
                    <p>Cargo</p>
                </div>

            </div>

        </aside>


        <main class="container-cadastro">

            <!--
                O conteúdo das etapas do cadastro
                será inserido pelo JavaScript.
            -->

        </main>


        <div class="container_pop_up" style="display: none;">
            <!-- Pop-ups -->
        </div>

    </div>


    <script src="js/cadastro-instancia.js"></script>

</body>

</html>
