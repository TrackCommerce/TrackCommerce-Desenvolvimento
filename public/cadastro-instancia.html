<!DOCTYPE html>
<html lang="en">
<head>

    <title>TrackCommerce | Cadastro de novo servidor</title>
</head>

         <aside class="sidebar">

                </div>

            </div>

            <nav class="menu">

                <a href="desenvolvimento.html" class="item">

                        <img src="./assets/imgs/home.png" alt="">

                </a>

                <a href="selecionar-servidor.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/server.png" alt="">

                </a>

                <a href="desenvolvimento.html" class="item">
                    <div class="icone">
                        <img src="./assets/imgs/bell.png" alt="">

                <a href="lista-instancia.html" class="item" ativo>

                    <h3>Usuário</h3>
                    <p>Cargo</p>
                </div>

        <div class="container_pop_up" style="display: none;"></div>

<!-- Link para o JavaScript -->
