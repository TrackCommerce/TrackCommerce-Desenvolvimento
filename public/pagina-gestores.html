<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestores cadastrados - TrackCommerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/icon/logo.png">
  <link rel="stylesheet" href="./css/barra-lateral-gestor.css">
  <link rel="stylesheet" href="./css/pagina-gestores.css">
  <script src="./js/pagina-gestores.js" defer></script>
</head>

<body>

  <aside class="barra-lateral">
    <a href="index.html" class="logo">
      <img class="icone logo-icone" src="./assets/icon/logo.png" alt="Logo TrackCommerce">
      <span class="logo-nome">TrackCommerce</span>
    </a>

    <p class="menu-titulo">MONITORAMENTO</p>
    <nav class="menu">
      <a href="cadastro-gestor.html" class="menu-item"><img class="icone" src="./assets/imgs/painel.svg"
          alt=""><span>Painel</span></a>
      <a href="pagina-gestores.html" class="menu-item ativo"><img class="icone" src="./assets/imgs/usuarios.svg"
          alt=""><span>Usuários cadastrados</span></a>
    </nav>

    <div class="perfil">
      <span class="perfil-foto"></span>
      <span class="perfil-nome" id="perfil_nome">Funcionário<br>TrackCommerce</span>
      <span class="perfil-opcoes">···</span>
    </div>
  </aside>

  <main class="conteudo">
    <p class="caminho">Painel &gt; <strong>Usuários</strong></p>

    <header class="cabecalho">
      <h1 class="titulo">GESTORES CADASTRADOS</h1>
      <a href="cadastro-gestor.html" class="botao-laranja"><img class="icone" src="./assets/imgs/mais.svg" alt=""> Novo
        cadastro</a>
    </header>

    <section class="cartao">
      <div class="cartao-topo">
        <h2 class="cartao-titulo">Gestores Cadastrados</h2>
        <span class="etiqueta-azul" id="qtd_gestores">Carregando...</span>
      </div>

      <div class="filtros">
        <label class="filtro filtro-busca">
          <span class="filtro-nome">Pesquisar usuário</span>
          <span class="filtro-caixa">
            <img class="icone filtro-icone" src="./assets/imgs/lupa.svg" alt="">
            <input type="text" id="ipt_busca" placeholder="Buscar por e-mail ou nome" oninput="filtrarGestores()">
          </span>
        </label>
      </div>

      <div class="tabela-rolagem">
        <table class="tabela">
          <thead>
            <tr>
              <th>USUÁRIO ↑</th>
              <th>E-MAIL</th>
              <th>CARGO</th>
              <th>TOKEN API <img class="icone icone-pequeno" src="./assets/imgs/cadeado.svg" alt=""></th>
              <th class="direita">AÇÕES</th>
            </tr>
          </thead>
          <tbody id="corpo_tabela">
            <tr>
              <td colspan="5" style="text-align: center; padding: 24px; color: #6b7790;">
                Carregando gestores...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <footer class="paginacao">
        <span class="paginacao-texto" id="texto_paginacao">Exibindo 0 de 0 usuários</span>
        <div class="paginacao-botoes" id="botoes_paginacao"></div>
      </footer>
    </section>
  </main>

</body>

</html>
